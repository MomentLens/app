# Lint, typecheck, test and build on every PR and every push to main (Handbook §11).
# The worker gets its own job, Ruff and pytest, in S-18a (docs/WorkSlices.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels that PR's older run. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typescript:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The root prepare script installs git hooks, which a CI checkout never uses.
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Installs the pnpm version pinned in package.json's packageManager field.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      # Dangling citations, code fences that are unbalanced or indented out of use, a D-nn
      # heading the parser cannot read, duplicate slugs, section numbers and ids, a note
      # naming a slice that does not exist, a spec section nothing points at, and a crash in
      # the brief builder. Retrieval never fails the build; only this does.
      - name: Check docs cross-references
        run: node scripts/doc.mjs check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter api build
