# Layered over Supabase's own docker/docker-compose.yml, pinned in setup.sh. setup.sh links this
# file into that folder, where docker compose loads it automatically.
#
# We run three of its services: db, auth and realtime. setup.sh starts only those, so PostgREST,
# the api-gw gateway (Envoy), Studio, Storage, imgproxy, meta, functions and Supavisor never start.
# The API reads and writes Postgres directly as its own login, and nginx routes Auth and Realtime
# itself (D-164).
#
# Needs Docker Compose 2.24.4 or later for !reset and !override.

services:
  db:
    # Upstream reaches Postgres only through Supavisor. We publish it on loopback instead, for the
    # API and the worker (whose queue lock needs a session connection, D-123) and for migrations
    # over an SSH tunnel. Never 0.0.0.0.
    ports:
      - 127.0.0.1:5432:5432

  auth:
    # Loopback only. nginx forwards /auth/v1/ here with the prefix stripped, as Envoy did.
    ports:
      - 127.0.0.1:9999:9999
    environment:
      # Signing keys from utils/add-new-auth-keys.sh. The EC key comes first, so access tokens
      # are ES256 and getClaims in apps/api verifies them against the JWKS endpoint.
      GOTRUE_JWT_KEYS: ${JWT_KEYS:?run utils/add-new-auth-keys.sh --update-env}
      # Mirrors supabase/config.toml, so the dev stack behaves like local Supabase.
      GOTRUE_PASSWORD_MIN_LENGTH: '8'
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: 'true'
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: '10'
      GOTRUE_RATE_LIMIT_EMAIL_SENT: '2'
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: '150'
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_MAILER_OTP_EXP: '3600'
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: 'true'

  realtime:
    # Loopback only. nginx forwards the app's WebSocket here and names the tenant in Host.
    ports:
      - 127.0.0.1:4000:4000
    environment:
      # Without the public JWKS, Realtime rejects ES256 tokens, the anon key included, RLS then
      # hides every row, and the app's postgres_changes channel receives nothing and reports no
      # error.
      API_JWT_JWKS: ${JWT_JWKS:?run utils/add-new-auth-keys.sh --update-env}
