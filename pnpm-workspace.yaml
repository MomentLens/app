packages:
  - 'apps/*'
  - 'packages/*'
# Each of these ships its native binary as a platform-specific optional dependency.
# Their install scripts only verify that binary or build one from source when it is
# missing, so none of them needs to run. Review this list when pnpm adds an entry.
allowBuilds:
  '@parcel/watcher': false
  '@sentry/cli': false
  '@swc/core': false
  esbuild: false
  unrs-resolver: false
engineStrict: true
# pnpm runs package scripts through cmd.exe on Windows, which cannot read POSIX syntax such as
# test:rls's `REQUIRE_SUPABASE=1 node ...`. Its own cross-platform shell runs them the same on
# all three machines (D-162).
shellEmulator: true
